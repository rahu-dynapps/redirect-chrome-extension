<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Redirection de domaines</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Redirection de domaines</h1>
      <label class="switch" title="Suspendre toutes les redirections">
        <input type="checkbox" id="global-enabled" />
        <span class="sr-only">Redirections activées</span>
      </label>
    </header>

    <section class="current">
      <span class="label">Onglet actif</span>
      <p id="host" class="host">—</p>
      <p id="state" class="state">Chargement…</p>
    </section>

    <div class="actions">
      <button type="button" id="primary" class="btn btn-primary" hidden></button>
      <button type="button" id="secondary" class="btn" hidden></button>
    </div>

    <footer>
      <button type="button" id="open-options" class="link">Gérer les redirections…</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
