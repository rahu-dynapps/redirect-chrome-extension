<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="launcherTitle">Search launcher</title>
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <main id="form">
      <input
        type="text"
        id="query"
        data-i18n-placeholder="phLauncherQuery"
        autocomplete="off"
        spellcheck="false"
        autofocus
      />

      <div class="selectors">
        <label class="field">
          <span data-i18n="labelSearch"></span>
          <select id="search"></select>
        </label>
        <label class="field">
          <span data-i18n="labelEnvironment"></span>
          <select id="environment"></select>
        </label>
      </div>

      <p id="preview" class="preview">&nbsp;</p>

      <footer class="hints">
        <span data-i18n-rich="hintEnter"></span>
        <span data-i18n-rich="hintCtrlEnter"></span>
        <span data-i18n-rich="hintAltNum"></span>
        <span data-i18n-rich="hintEsc"></span>
      </footer>
    </main>

    <main id="empty" hidden>
      <p class="empty-title" data-i18n="launcherEmptyTitle"></p>
      <p id="empty-detail" class="empty-detail"></p>
      <button type="button" id="configure" class="btn btn-primary" data-i18n="launcherConfigure"></button>
    </main>

    <script type="module" src="launcher.js"></script>
  </body>
</html>
