<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="optionsTitle">Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="brand">
        <img src="../../icons/icon48.png" alt="" width="32" height="32" />
        <div>
          <h1 data-i18n="extName"></h1>
          <p class="subtitle" data-i18n="appTagline"></p>
        </div>
      </div>
      <label class="switch" id="global-switch">
        <input type="checkbox" id="global-enabled" />
        <span data-i18n="redirectsEnabled"></span>
      </label>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab" data-tab="redirects" role="tab" data-i18n="tabRedirects"></button>
      <button type="button" class="tab" data-tab="launcher" role="tab" data-i18n="tabLauncher"></button>
    </nav>

    <main>
      <div class="tab-panel" data-panel="redirects">
        <section id="rule-error-banner" class="banner banner-error" hidden>
          <div>
            <strong data-i18n="ruleErrorTitle"></strong>
            <span data-i18n="ruleErrorHint"></span>
            <ul id="rule-error-list" class="banner-list"></ul>
          </div>
        </section>

        <section id="permission-banner" class="banner banner-warn" hidden>
          <div>
            <strong data-i18n="permBannerTitle"></strong>
            <span data-i18n="permBannerText"></span>
          </div>
          <button type="button" id="grant-all" class="btn btn-primary" data-i18n="permGrantAll"></button>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 data-i18n="sectionRedirects"></h2>
            <button type="button" id="add-rule" class="btn btn-primary" data-i18n="addRedirect"></button>
          </div>
          <p class="hint" data-i18n="redirectsHint"></p>
          <p class="hint" data-i18n-rich="patternHint"></p>
          <ul id="rules" class="rules"></ul>
          <p id="empty-state" class="empty" data-i18n-rich="redirectsEmpty" hidden></p>
        </section>

        <section class="card">
          <h2 data-i18n="testTitle"></h2>
          <p class="hint" data-i18n="testHint"></p>
          <div class="test-row">
            <input type="text" id="test-input" data-i18n-placeholder="phTestUrl" spellcheck="false" />
            <button type="button" id="test-run" class="btn" data-i18n="testRun"></button>
          </div>
          <p id="test-result" class="test-result" hidden></p>
        </section>
      </div>

      <div class="tab-panel" data-panel="launcher" hidden>
        <section class="card">
          <div class="card-head">
            <h2 data-i18n="sectionEnvironments"></h2>
            <button type="button" id="add-environment" class="btn btn-primary" data-i18n="addEnvironment"></button>
          </div>
          <p class="hint" data-i18n-rich="environmentsHint"></p>
          <ul id="environments" class="rules"></ul>
          <p id="environments-empty" class="empty" data-i18n-rich="environmentsEmpty" hidden></p>
          <datalist id="known-hosts"></datalist>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 data-i18n="sectionSearches"></h2>
            <button type="button" id="add-search" class="btn btn-primary" data-i18n="addSearch"></button>
          </div>
          <p class="hint" data-i18n-rich="searchesHint"></p>
          <ul id="searches" class="rules"></ul>
          <p id="searches-empty" class="empty" data-i18n="searchesEmpty" hidden></p>
        </section>

        <section class="card">
          <h2 data-i18n="sectionShortcuts"></h2>
          <p class="hint" data-i18n-rich="shortcutsHint"></p>
          <button type="button" id="open-shortcuts" class="btn" data-i18n="openShortcuts"></button>
          <ul id="slots" class="slots"></ul>
          <label class="open-in">
            <span data-i18n="openInLabel"></span>
            <select id="open-in">
              <option value="new-tab" data-i18n="openInNewTab"></option>
              <option value="current-tab" data-i18n="openInCurrentTab"></option>
            </select>
          </label>
        </section>
      </div>

      <section class="card">
        <h2 data-i18n="sectionBackup"></h2>
        <p class="hint" data-i18n="backupHint"></p>
        <div class="row-actions">
          <button type="button" id="export" class="btn" data-i18n="exportBtn"></button>
          <button type="button" id="import" class="btn" data-i18n="importBtn"></button>
          <input type="file" id="import-file" accept="application/json,.json" hidden />
        </div>
        <p id="io-result" class="test-result" hidden></p>
      </section>
    </main>

    <footer><span id="status" class="status" role="status" aria-live="polite"></span></footer>

    <template id="rule-template">
      <li class="rule">
        <div class="rule-head">
          <select class="js-kind" data-i18n-title="kindLabel">
            <option value="domain" data-i18n="kindDomain"></option>
            <option value="pattern" data-i18n="kindPattern"></option>
          </select>
          <div class="rule-buttons">
            <label class="switch switch-sm" data-i18n-title="toggleEnableRule">
              <input type="checkbox" class="js-enabled" />
              <span class="sr-only" data-i18n="btnEnable"></span>
            </label>
            <button type="button" class="icon-btn js-up" data-i18n-title="btnUp" data-i18n-label="btnUp">↑</button>
            <button type="button" class="icon-btn js-down" data-i18n-title="btnDown" data-i18n-label="btnDown">
              ↓
            </button>
            <button
              type="button"
              class="icon-btn danger js-delete"
              data-i18n-title="btnDelete"
              data-i18n-label="btnDelete"
            >
              ✕
            </button>
          </div>
        </div>

        <div class="rule-grid domain-only">
          <label class="field">
            <span data-i18n="fieldSourceDomain"></span>
            <input type="text" class="js-from" data-i18n-placeholder="phSourceDomain" spellcheck="false" />
          </label>
          <span class="arrow" aria-hidden="true">→</span>
          <label class="field">
            <span data-i18n="fieldTargetDomain"></span>
            <input type="text" class="js-to" data-i18n-placeholder="phTargetDomain" spellcheck="false" />
          </label>
        </div>

        <div class="rule-grid pattern-only">
          <label class="field">
            <span data-i18n="fieldSourcePattern"></span>
            <input type="text" class="js-pattern" data-i18n-placeholder="phSourcePattern" spellcheck="false" />
          </label>
          <span class="arrow" aria-hidden="true">→</span>
          <label class="field">
            <span data-i18n="fieldTargetTemplate"></span>
            <input type="text" class="js-target" data-i18n-placeholder="phTargetTemplate" spellcheck="false" />
          </label>
        </div>

        <div class="rule-options">
          <label class="domain-only">
            <input type="checkbox" class="js-subdomains" /> <span data-i18n="optSubdomains"></span>
          </label>
          <label class="domain-only">
            <input type="checkbox" class="js-https" /> <span data-i18n="optForceHttps"></span>
          </label>
          <label><input type="checkbox" class="js-subframes" /> <span data-i18n="optSubframes"></span></label>
          <input type="text" class="js-note note" data-i18n-placeholder="phNote" maxlength="200" />
        </div>
        <p class="rule-message js-message" hidden></p>
      </li>
    </template>

    <template id="environment-template">
      <li class="rule">
        <div class="env-grid">
          <label class="field">
            <span data-i18n="fieldName"></span>
            <input type="text" class="js-label" data-i18n-placeholder="phEnvName" maxlength="60" />
          </label>
          <label class="field">
            <span data-i18n="fieldBaseUrl"></span>
            <input
              type="text"
              class="js-base"
              list="known-hosts"
              data-i18n-placeholder="phBaseUrl"
              spellcheck="false"
            />
          </label>
          <div class="rule-buttons">
            <button type="button" class="icon-btn js-up" data-i18n-title="btnUp" data-i18n-label="btnUp">↑</button>
            <button type="button" class="icon-btn js-down" data-i18n-title="btnDown" data-i18n-label="btnDown">
              ↓
            </button>
            <button
              type="button"
              class="icon-btn danger js-delete"
              data-i18n-title="btnDelete"
              data-i18n-label="btnDelete"
            >
              ✕
            </button>
          </div>
        </div>
        <p class="rule-message js-message" hidden></p>
      </li>
    </template>

    <template id="search-template">
      <li class="rule">
        <div class="search-grid">
          <label class="field">
            <span data-i18n="fieldName"></span>
            <input type="text" class="js-label" data-i18n-placeholder="phSearchName" maxlength="60" />
          </label>
          <label class="field field-sm">
            <span data-i18n="fieldKeyword"></span>
            <input type="text" class="js-keyword" data-i18n-placeholder="phKeyword" maxlength="16" spellcheck="false" />
          </label>
          <label class="field field-lg">
            <span data-i18n="fieldUrlTemplate"></span>
            <input type="text" class="js-template" data-i18n-placeholder="phTemplate" spellcheck="false" />
          </label>
          <label class="field">
            <span data-i18n="fieldEnvironment"></span>
            <select class="js-env"></select>
          </label>
          <div class="rule-buttons">
            <button type="button" class="icon-btn js-up" data-i18n-title="btnUp" data-i18n-label="btnUp">↑</button>
            <button type="button" class="icon-btn js-down" data-i18n-title="btnDown" data-i18n-label="btnDown">
              ↓
            </button>
            <button
              type="button"
              class="icon-btn danger js-delete"
              data-i18n-title="btnDelete"
              data-i18n-label="btnDelete"
            >
              ✕
            </button>
          </div>
        </div>
        <details class="overrides">
          <summary>
            <span data-i18n="overridesSummary"></span>
            <span class="js-overrides-count overrides-count"></span>
          </summary>
          <p class="hint" data-i18n="overridesHint"></p>
          <div class="js-overrides overrides-grid"></div>
        </details>
        <p class="rule-message js-message" hidden></p>
      </li>
    </template>

    <template id="slot-template">
      <li class="slot">
        <span class="slot-name"></span>
        <label class="field">
          <span data-i18n="labelSearch"></span>
          <select class="js-search"></select>
        </label>
        <label class="field">
          <span data-i18n="labelEnvironment"></span>
          <select class="js-env"></select>
        </label>
      </li>
    </template>

    <script type="module" src="options.js"></script>
  </body>
</html>
